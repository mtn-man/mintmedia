# mintmedia example configuration
# Copy this file to your config location and edit paths/values as needed.
# Keep in sync with internal/config/defaults_darwin.toml and defaults_linux.toml (the embedded bootstrap copies).

# -----------------------------------------------------------------------------
# START HERE: dest_dir_movies and dest_dir_shows below are the settings you're
# most likely to need to change -- where mintmedia puts your organized library.
# -----------------------------------------------------------------------------
[destinations]
# Destination for processed movies
# macOS default: "~/Movies/Movies"
# Linux default: "~/Videos/Movies"
dest_dir_movies = "~/Movies/Movies"

# Destination for processed TV shows
# macOS default: "~/Movies/Shows"
# Linux default: "~/Videos/Shows"
dest_dir_shows = "~/Movies/Shows"


[paths]
# Folder watched for incoming media (drop zone).
# Use an absolute path or "~" if mintmedia expands it.
drop_folder = "~/Downloads/MintDrop"


# State directory (history, internal bookkeeping, etc.)
# macOS idiomatic:   "~/Library/Application Support/mintmedia"
# Linux/XDG default: "~/.local/state/mintmedia"
state_dir = "~/Library/Application Support/mintmedia"


[system]
# If true, mintmedia will attempt to create missing destination directories.
auto_create_missing_dirs = true

# If true, mintmedia will wait until destinations exist and are writable before processing.
defer_destination_checks = true

# Done notification policy after successful processing.
# Allowed values: "per_file", "per_job", "off"
done_notification_mode = "per_file"

# Grace period to allow in-flight work to complete after shutdown is requested.
shutdown_grace_duration = "10m"

# Additional wait after forced cancellation before giving up shutdown.
shutdown_force_timeout = "15s"


[features]
# Enable media processing (rename/move/organize)
enable_processing = true

# Enable torrent client automation/integration (e.g., Transmission)
# Default off in the example config to avoid surprises.
enable_torrent_automation = false

# Rewrite each sorted file's embedded container metadata "title" tag to match
# its final sorted name (fixes stale titles showing through in certain cases).
# Requires ffmpeg on PATH. Default off -- advanced/optional.
# NOTE: enabling this option will increase per-file processing time.
enable_metadata_title_tagging = false

[logging]
# Console operational log filter (DEBUG | INFO | WARN | ERROR)
# DEBUG means "log everything"
console_level = "INFO"

# History file filter (DEBUG | INFO | WARN | ERROR)
history_level = "WARN"

# Persistent JSONL history file (stored under state_dir when relative)
history_file = "history.jsonl"


[watch]
drop_settle_duration = "3s"

[media]
# Main media file extensions (movies/episodes)
main_media_extensions = [".mkv", ".mp4", ".avi", ".mov", ".wmv", ".flv", ".webm"]

# Files that should follow the main media (subtitles, metadata, etc.)
# Keep this list strict by default; add ".nfo" if you intentionally want metadata from release groups.
associated_file_extensions = [".srt", ".sub", ".ass", ".idx", ".vtt"]


[naming]
# mintmedia always strips a built-in set of resolution/codec/source/edition
# tags (2160p, 1080p, x265, WEB-DL, PROPER, EXTENDED, etc.) when deriving a
# clean title -- that's not configurable here. Add regex patterns below only
# for tags the built-in list doesn't already cover; they're merged on top of
# the defaults, not a replacement for them.
media_tag_blacklist = []

# When true, re-append the resolution detected from the source filename to the
# sorted name as a " - <res>" suffix, e.g. "Movie (2020) - 1080p.mkv" /
# "Show (2020) - S01E02 - 1080p.mkv" (the folder name is left unchanged), and
# treat the resolution as part of identity for duplicate detection, for both
# movies and shows:
#   - a different resolution of a title/episode already in the library sorts
#     in alongside it (keep 1080p and 2160p side by side)
#   - only an exact match including the resolution is skipped as a duplicate
#   - a resolution mismatch against an untagged copy -- an incoming file with
#     no detectable resolution colliding with a resolution-tagged copy, or a
#     resolution-tagged incoming file colliding with an untagged copy -- is
#     left in the drop folder for review, not sorted
# The resolution is read from the release name only, not the video stream.
# Off by default.
resolution_aware = false

# Keep an already-clean trailing episode title instead of discarding it. Off by default; see docs/configuration.md.
preserve_episode_titles = false

[torrent]
# Keep the section present for discoverability, but default it OFF.
enabled = false

# If true, daemon removes completed Transmission entries after successful APPLIED processing.
# Set false to keep completed entries in Transmission.
auto_cleanup_completed_torrents = false

# Transmission RPC host (host:port)
host = "localhost:9091"

# Optional authentication (only if required)
# auth = "user:pass"
